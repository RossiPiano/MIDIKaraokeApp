function midiJumpToRehearsalMark(name) {
  midiExitLoopForSectionJump();
  const targetName = String(name || '').trim().toLowerCase();

  if (!targetName) return;

  const exactMatches = midiPlayback.rehearsalMarks.filter(function(item) {
    return item.text.trim().toLowerCase() === targetName;
  });

  // Prefer genuine MIDI Marker/Cue Point events over ordinary Text events.
  // This prevents an ordinary text item with the same name from being
  // mistaken for the structural section marker.
  const structuralMatch = exactMatches.find(function(item) {
    return item.markerType === 'marker' || item.markerType === 'cuePoint';
  });

  // Ordinary MIDI Text events are intentionally NOT accepted as rehearsal
  // marks.  Only actual Marker/Cue Point meta-events count as structural
  // Section Marks.
  const mark = structuralMatch;

  if (!mark) {
    setStatus("Rehearsal mark not found: '" + name + "'.");
    return;
  }

  const targetSeconds = Math.max(
    0,
    Math.min(mark.seconds, midiPlayback.durationSeconds)
  );

  midiPlayback.pausedTimeSeconds = targetSeconds;

  if (midiPlayback.playing) {
    midiStartPlayback(targetSeconds).catch(function(error) {
      console.error('[midi] Could not jump to rehearsal mark:', error);
      setStatus('Rehearsal mark jump error: ' + (error.message || error));
    });
    return;
  }

  setStatus(
    "Moved to '" + mark.text + "' rehearsal mark: " +
    formatTime(targetSeconds, true)
  );
}

function midiExitLoopForSectionJump() {
  if (midiPlayback.looping) {
    midiPlayback.looping = false;
  }
}

function midiJumpToPreviousMarker() {
  midiExitLoopForSectionJump();
  const currentSeconds = midiGetCurrentTime();
  const markers = midiGetDisplayedSectionMarks();

  if (!markers.length) {
    setStatus('No MIDI Markers found.');
    return;
  }

  // Determine the current section from the displayed Section Marks list,
  // using the last displayed marker at or before the current playback time.
  // This remains valid no matter how many seconds have passed since the
  // section marker.
  let currentIndex = -1;
  for (let i = 0; i < markers.length; i++) {
    if (markers[i].seconds <= currentSeconds + 0.000001) {
      currentIndex = i;
    } else {
      break;
    }
  }

  const targetIndex = currentIndex - 1;
  if (currentIndex <= 0 || targetIndex < 0) {
    setStatus('Already at the first MIDI Marker.');
    return;
  }

  const target = markers[targetIndex];

  midiPlayback.pausedTimeSeconds = Math.max(
    0,
    Math.min(target.seconds, midiPlayback.durationSeconds)
  );

  midiStartPlayback(target.seconds).catch(function(error) {
    console.error('[midi] Could not jump to previous MIDI marker:', error);
    setStatus('Previous MIDI Marker jump error: ' + (error.message || error));
  });
}

function midiJumpToMarkerNumber(markerNumber) {
  midiExitLoopForSectionJump();
  const markers = midiGetDisplayedSectionMarks();
  const marker = markers[markerNumber - 1];

  if (!marker) {
    setStatus('MIDI Marker ' + markerNumber + ' not found.');
    return;
  }

  const targetSeconds = Math.max(
    0,
    Math.min(marker.seconds, midiPlayback.durationSeconds)
  );

  midiPlayback.pausedTimeSeconds = targetSeconds;

  midiStartPlayback(targetSeconds).catch(function(error) {
    console.error('[midi] Could not jump to MIDI Marker ' + markerNumber + ':', error);
    setStatus('Marker ' + markerNumber + ' jump error: ' + (error.message || error));
  });
}

function midiJumpToCurrentSectionStart() {
  midiExitLoopForSectionJump();
  const currentMarker = midiGetCurrentStructuralMarker();

  if (!currentMarker) {
    setStatus('No current MIDI Section found.');
    return;
  }

  const targetSeconds = Math.max(
    0,
    Math.min(currentMarker.seconds, midiPlayback.durationSeconds)
  );

  midiPlayback.pausedTimeSeconds = targetSeconds;

  midiStartPlayback(targetSeconds).catch(function(error) {
    console.error('[midi] Could not jump to current section start:', error);
    setStatus('Current Section jump error: ' + (error.message || error));
  });
}

function midiSpaceSectionToggle() {
  if (midiPlayback.looping &&
      midiPlayback.loopStartSeconds !== null &&
      midiPlayback.loopEndSeconds !== null &&
      midiPlayback.loopEndSeconds > midiPlayback.loopStartSeconds) {
    const loopStartSeconds = Math.max(
      0,
      Math.min(midiPlayback.loopStartSeconds, midiPlayback.durationSeconds)
    );

    if (midiPlayback.playing) {
      midiStopPlayback();
      midiPlayback.pausedTimeSeconds = loopStartSeconds;
      setStatus('Stopped at Loop Start: ' + formatTime(loopStartSeconds, true));
      return;
    }

    midiPlayback.pausedTimeSeconds = loopStartSeconds;
    midiStartPlayback(loopStartSeconds).catch(function(error) {
      console.error('[midi] Could not start loop:', error);
      setStatus('Loop playback error: ' + (error.message || error));
    });
    return;
  }

  const currentMarker = midiGetCurrentStructuralMarker();

  if (!currentMarker) {
    const currentSeconds = Math.max(
      0,
      Math.min(midiGetCurrentTime(), midiPlayback.durationSeconds)
    );

    if (midiPlayback.playing) {
      midiStopPlayback();
      midiPlayback.pausedTimeSeconds = currentSeconds;
      setStatus('Stopped at current position: ' + formatTime(currentSeconds, true));
      return;
    }

    midiPlayback.pausedTimeSeconds = currentSeconds;
    midiStartPlayback(currentSeconds).catch(function(error) {
      console.error('[midi] Could not start from current position:', error);
      setStatus('Current-position playback error: ' + (error.message || error));
    });
    return;
  }

  const targetSeconds = Math.max(
    0,
    Math.min(currentMarker.seconds, midiPlayback.durationSeconds)
  );

  if (midiPlayback.playing) {
    midiStopPlayback();
    midiPlayback.pausedTimeSeconds = targetSeconds;
    setStatus('Stopped at current Section start: ' + formatTime(targetSeconds, true));
    return;
  }

  midiPlayback.pausedTimeSeconds = targetSeconds;
  midiStartPlayback(targetSeconds).catch(function(error) {
    console.error('[midi] Could not start current section:', error);
    setStatus('Current Section playback error: ' + (error.message || error));
  });
}

function midiJumpToNextMarker() {
  midiExitLoopForSectionJump();
  const currentSeconds = midiGetCurrentTime();
  const markers = midiGetDisplayedSectionMarks();

  if (!markers.length) {
    setStatus('No MIDI Markers found.');
    return;
  }

  // Determine the current section from the displayed Section Marks list,
  // then move exactly one displayed section forward.  This means Next
  // Section also works at any point after the current marker, not only
  // immediately around the marker itself.
  let currentIndex = -1;
  for (let i = 0; i < markers.length; i++) {
    if (markers[i].seconds <= currentSeconds + 0.000001) {
      currentIndex = i;
    } else {
      break;
    }
  }

  const targetIndex = currentIndex + 1;
  if (targetIndex >= markers.length) {
    setStatus('Already at the last MIDI Marker.');
    return;
  }

  const target = markers[targetIndex];

  midiPlayback.pausedTimeSeconds = Math.max(
    0,
    Math.min(target.seconds, midiPlayback.durationSeconds)
  );

  midiStartPlayback(target.seconds).catch(function(error) {
    console.error('[midi] Could not jump to next MIDI marker:', error);
    setStatus('Next MIDI Marker jump error: ' + (error.message || error));
  });
}

/* =========================================================
   KEYBOARD
   ========================================================= */

window.addEventListener('keydown', function(e) {
  if (e.key === 'F11') {
    // Let the browser's native F11 fullscreen handling work.
    return;
  }

  if (e.ctrlKey || e.metaKey || e.altKey) return;

  if (midiSongListOpen) {
    e.preventDefault();
    midiHandleSavedSongListKey(e.key);
    return;
  }

  if (e.shiftKey && e.key === 'ArrowLeft') {
    e.preventDefault();
    midiChangeBpm(-1);
    return;
  }

  if (e.shiftKey && e.key === 'ArrowRight') {
    e.preventDefault();
    midiChangeBpm(1);
    return;
  }

  switch (e.key) {
    case 'p':
    case 'P':
    case 'z':
    case 'Z':
      e.preventDefault();
      midiRecordTimestamp('P+L');
      break;

    case 'l':
    case 'L':
    case 'c':
    case 'C':
      e.preventDefault();
      midiRecordTimestamp('L');
      break;

    case 'Delete':
    case 'x':
    case 'X':
      e.preventDefault();
      midiRemoveTimestamp();
      break;

    case 'ArrowDown':
    case 's':
    case 'S':
      e.preventDefault();
      midiTranspose(-1);
      break;

    case 'ArrowUp':
    case 'w':
    case 'W':
      e.preventDefault();
      midiTranspose(1);
      break;

    case 'Home':
      e.preventDefault();
      midiStartOrPausePlayback();
      break;

    case ',':
      e.preventDefault();
      midiMoveLoopRangeByBars(-1);
      break;

    case 'ArrowLeft':
    case 'a':
    case 'A':
      e.preventDefault();
      midiChangeBpm(-5);
      break;

    case '0':
      e.preventDefault();
      midiRestoreOriginalBpm();
      break;

    case 'ArrowRight':
    case 'd':
    case 'D':
      e.preventDefault();
      midiChangeBpm(5);
      break;

    case '[':
    case 'q':
    case 'Q':
      e.preventDefault();
      midiSetLoopStart();
      break;

    case ']':
    case 'e':
    case 'E':
      e.preventDefault();
      midiSetLoopEnd();
      break;

    case 'r':
    case 'R':
      e.preventDefault();
      midiToggleLoop();
      break;

    case '=':
      e.preventDefault();
      midiMoveLoopStartByBeats(1);
      break;

    case '-':
      e.preventDefault();
      midiMoveLoopStartByBeats(-1);
      break;

    case 'PageDown':
      e.preventDefault();
      midiJumpToPreviousMarker();
      break;

    case '.':
      e.preventDefault();
      midiMoveLoopRangeByBars(1);
      break;

    case 'Enter':
      e.preventDefault();
      midiJumpToCurrentSectionStart();
      break;

    case '1':
      e.preventDefault();
      midiJumpToMarkerNumber(1);
      break;
    case '2':
      e.preventDefault();
      midiJumpToMarkerNumber(2);
      break;
    case '3':
      e.preventDefault();
      midiJumpToMarkerNumber(3);
      break;
    case '4':
      e.preventDefault();
      midiJumpToMarkerNumber(4);
      break;
    case '5':
      e.preventDefault();
      midiJumpToMarkerNumber(5);
      break;
    case '6':
      e.preventDefault();
      midiJumpToMarkerNumber(6);
      break;
    case '7':
      e.preventDefault();
      midiJumpToMarkerNumber(7);
      break;
    case '8':
      e.preventDefault();
      midiJumpToMarkerNumber(8);
      break;
    case '9':
      e.preventDefault();
      midiJumpToMarkerNumber(9);
      break;
    case '`':
      e.preventDefault();
      midiStartPlayback(0).catch(function(error) {
        console.error('[midi] Could not jump to song beginning:', error);
        setStatus('Song beginning jump error: ' + (error.message || error));
      });
      break;

    case 'PageUp':
      e.preventDefault();
      midiStopPlayback();
      break;

    case ' ':
      e.preventDefault();
      midiSpaceSectionToggle();
      break;

    case 'End':
      e.preventDefault();
      midiJumpToNextMarker();
      break;

    case '1':
      e.preventDefault();
      midiJumpToRehearsalMark('Verse 1');
      break;

    case '2':
      e.preventDefault();
      midiJumpToRehearsalMark('Chorus 1');
      break;

    case 'F1':
      e.preventDefault();
      showShortcutInfo();
      break;

    case 'F3':
      e.preventDefault();
      midiOpenFilePicker();
      break;

    case 'F4':
      e.preventDefault();
      sf2OpenFilePicker();
      break;

    case 'F5':
      e.preventDefault();
      midiSaveSong();
      break;

    case 'F9':
      e.preventDefault();
      if (midiSongListOpen) {
        midiCloseSavedSongList();
      } else {
        midiOpenSavedSongList();
      }
      break;
  }
}, true);

let midiLastDisplayedMarkerKey = null;

setInterval(function() {
  if (!midiPlayback.playing) return;

  sendCommand('midi-time', {
    seconds: midiGetCurrentTime(),
    duration: midiPlayback.durationSeconds,
    bpm: midiPlayback.bpm,
    transpose: midiPlayback.transposeSemitones
  });

  const currentMarker = midiGetCurrentStructuralMarker();
  const currentMarkerKey = currentMarker
    ? currentMarker.text.trim().toLowerCase()
    : '';

  if (currentMarkerKey !== midiLastDisplayedMarkerKey) {
    midiLastDisplayedMarkerKey = currentMarkerKey;
    setStatus(midiStatusMessage);

}, 50);

(function(){

$('uiMidi').onclick=()=>call('midiOpenFilePicker');$('uiSf2').onclick=()=>call('sf2OpenFilePicker');$('uiHelp').onclick=()=>call('showShortcutInfo');$('uiFull').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('uiPlay').onclick=()=>call('midiStartOrPausePlayback');$('uiStop').onclick=()=>call('midiStopPlayback');$('uiSave').onclick=()=>call('midiSaveSong');$('uiJson').onclick=()=>call('midiLoadSongPicker');$('uiLoad').onclick=async()=>{const id=$('uiSongs').value;if(!id)return;const list=await midiSongDbGetAll();const r=list.find(x=>String(x.id)===id);if(r)await midiLoadStoredSong(r);refresh()};$('uiDelete').onclick=async()=>{const id=$('uiSongs').value;if(!id)return;const list=await midiSongDbGetAll(),r=list.find(x=>String(x.id)===id);if(r&&confirm('Delete saved song “'+(r.name||'Untitled Song')+'”?')){await midiSongDbDelete(r.id);refreshSongs()}};

);$('tsRemove').onclick=()=>call('midiRemoveTimestamp');

<script>
(function(){
'use strict';
const timeline=document.getElementById('midiTimeline');
const info=document.getElementById('uiTimelineInfo');
const pointStatus=document.getElementById('timelinePointStatus');
let beats=[];let tapStep='start';let lastBeatCount=0;
const fmt=x=>{x=Math.max(0,Number(x)||0);return Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0')};
function countBeats(){if(typeof midiPlayback==='undefined'||!midiPlayback.parsed||!midiPlayback.parsed.ticksPerQuarter||typeof midiGetTickForSeconds!=='function')return 0;return Math.max(1,Math.ceil(midiGetTickForSeconds(Number(midiPlayback.durationSeconds)||0)/midiPlayback.parsed.ticksPerQuarter));}
function beatTime(n){if(typeof midiGetSecondsForTick!=='function'||!midiPlayback.parsed)return 0;return midiGetSecondsForTick(n*midiPlayback.parsed.ticksPerQuarter);}
function resetTapStep(){tapStep='start';if(pointStatus)pointStatus.textContent='Tap a beat for Loop Start. The next tap will set Loop End.';}
function render(){const n=countBeats();if(n===lastBeatCount&&beats.length)return;lastBeatCount=n;beats=[];timeline.innerHTML='';if(!n){timeline.classList.add('empty');timeline.textContent='Load a MIDI file to show the song beats.';info.textContent='Load a MIDI song';resetTapStep();return;}timeline.classList.remove('empty');info.textContent=n+' beats · 1 beat per cell';const frag=document.createDocumentFragment();for(let i=0;i<n;i++){const b=document.createElement('button');b.type='button';b.className='beat';b.dataset.beat=i;b.innerHTML='<span class="beat-number">'+(i+1)+'</span><span class="beat-time">'+fmt(beatTime(i))+'</span>';b.addEventListener('click',()=>chooseBeat(i));frag.appendChild(b);beats.push(b);}timeline.appendChild(frag);update();}
function chooseBeat(i){if(tapStep==='start'){const start=beatTime(i);midiPlayback.loopStartSeconds=start;midiPlayback.loopEndSeconds=null;midiPlayback.looping=false;tapStep='end';if(pointStatus)pointStatus.textContent='Loop Start Beat '+(i+1)+' set ('+fmt(start)+'). Tap another beat for Loop End.';const loop=document.getElementById('loopToggle');if(loop){loop.textContent='🔁';loop.classList.remove('loop-on');}update();return;}const start=midiPlayback.loopStartSeconds;if(start===null){tapStep='start';chooseBeat(i);return;}const end=beatTime(Math.min(i+1,beats.length));tapStep='start';if(end<=start){if(pointStatus)pointStatus.textContent='Loop End must be after Loop Start. Next tap will set a new Loop Start.';update();return;}midiPlayback.loopEndSeconds=end;midiPlayback.looping=true;const loop=document.getElementById('loopToggle');if(loop){loop.textContent='🔁';loop.classList.add('loop-on');}if(pointStatus)pointStatus.textContent='Loop set: Beats '+(Math.max(0,Math.floor(midiGetTickForSeconds(start)/(midiPlayback.parsed.ticksPerQuarter||480)))+1)+'–'+(i+1)+' ('+fmt(start)+' – '+fmt(end)+'). Next tap will set a new Loop Start.';const status=document.getElementById('uiStatus');if(status)status.textContent='Loop selected and ON. Playback started from Loop Start.';try{if(typeof midiStartPlayback==='function')midiStartPlayback(start);}catch(_){}update();}
function update(){if(!beats.length||typeof midiPlayback==='undefined')return;const now=typeof midiGetCurrentTime==='function'?midiGetCurrentTime():0;const curTick=typeof midiGetTickForSeconds==='function'?midiGetTickForSeconds(now):0;const tpq=midiPlayback.parsed&&midiPlayback.parsed.ticksPerQuarter||480;const cur=Math.max(0,Math.min(beats.length-1,Math.floor(curTick/tpq)));let lo=null,hi=null;if(midiPlayback.loopStartSeconds!=null&&midiPlayback.loopEndSeconds!=null){const st=typeof midiGetTickForSeconds==='function'?midiGetTickForSeconds(midiPlayback.loopStartSeconds):0;const et=typeof midiGetTickForSeconds==='function'?midiGetTickForSeconds(Math.max(0,midiPlayback.loopEndSeconds-0.0001)):0;lo=Math.max(0,Math.min(beats.length-1,Math.floor(st/tpq)));hi=Math.max(lo,Math.min(beats.length-1,Math.floor(et/tpq)));}else if(midiPlayback.loopStartSeconds!=null){const st=typeof midiGetTickForSeconds==='function'?midiGetTickForSeconds(midiPlayback.loopStartSeconds):0;lo=Math.max(0,Math.min(beats.length-1,Math.floor(st/tpq)));}beats.forEach((b,i)=>{b.classList.toggle('current',i===cur);b.classList.toggle('selected',lo!==null&&hi!==null&&i>=lo&&i<=hi);b.classList.toggle('anchor',lo!==null&&i===lo);b.classList.toggle('loop-start-pending',lo!==null&&hi===null&&i===lo);});}
function updateTimelineView(){const view=document.getElementById('timelineView');if(!view||!beats.length){if(view)view.textContent='All beats';return;}const first=Math.max(0,Math.floor(timeline.scrollLeft/48));const visible=Math.max(1,Math.ceil(timeline.clientWidth/48));const last=Math.min(beats.length,first+visible);view.textContent='Beats '+(first+1)+'–'+last+' / '+beats.length;}
let dragState=null;
timeline.addEventListener('pointerdown',e=>{if(!beats.length||e.button!==undefined&&e.button!==0)return;const beatTarget=e.target.closest?.('.beat');dragState={pointerId:e.pointerId,startX:e.clientX,startScrollLeft:timeline.scrollLeft,moved:false,beatTarget:beatTarget};timeline.setPointerCapture?.(e.pointerId);});
timeline.addEventListener('pointermove',e=>{if(!dragState||e.pointerId!==dragState.pointerId)return;const dx=e.clientX-dragState.startX;if(Math.abs(dx)>6)dragState.moved=true;if(dragState.moved){timeline.scrollLeft=dragState.startScrollLeft-dx;timeline.classList.add('dragging');updateTimelineView();e.preventDefault();}});
function finishTimelineDrag(e){if(!dragState||e.pointerId!==dragState.pointerId)return;const state=dragState;dragState=null;timeline.classList.remove('dragging');if(state.moved){e.preventDefault();timeline.dataset.suppressClick='1';setTimeout(()=>{delete timeline.dataset.suppressClick;},120);return;}if(state.beatTarget){const i=Number(state.beatTarget.dataset.beat);if(Number.isInteger(i))chooseBeat(i);e.preventDefault();timeline.dataset.suppressClick='1';setTimeout(()=>{delete timeline.dataset.suppressClick;},120);}}
timeline.addEventListener('pointerup',finishTimelineDrag);timeline.addEventListener('pointercancel',finishTimelineDrag);timeline.addEventListener('click',e=>{if(timeline.dataset.suppressClick==='1'){e.preventDefault();e.stopPropagation();delete timeline.dataset.suppressClick; }},{capture:true});
timeline.addEventListener('scroll',updateTimelineView,{passive:true});setInterval(()=>{render();update();updateTimelineView();},200);
})();
</script>
