<style>

*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px}button,input,select{font:inherit}button{min-height:52px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text);font-weight:650;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(1px)}button.primary{background:#155c91;border-color:#348fd1}button.good{background:#176342;border-color:#2b9e70}button.danger{background:#713139;border-color:#b84d58}select{width:100%;min-height:52px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text)}input[type=range]{width:100%;min-height:42px;accent-color:var(--accent)}#midiGraphicalUI{max-width:1450px;margin:auto}#midiTimelineCard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px;user-select:none}.timeline-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.timeline-head strong{font-size:16px}.timeline-head span{color:var(--muted);font-size:13px}.timeline{display:flex;width:100%;min-height:58px;overflow-x:hidden;overflow-y:hidden;border:1px solid var(--border);border-radius:10px;background:#090b0e;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab}.timeline.dragging{cursor:grabbing}.timeline.empty{align-items:center;justify-content:center;color:var(--muted);padding:10px}.bar{position:relative;flex:1 1 0;min-width:24px;height:58px;border:0;border-right:1px solid #343b45;border-radius:0;background:#20262e;color:#cbd3dd;padding:0 3px;font-size:11px;font-weight:700;touch-action:none;cursor:pointer}.bar:last-child{border-right:0}.bar:nth-child(4n+1){background:#252c35}.bar:hover{background:#303a46}.bar.selected{background:#155c91;color:#fff}.bar.anchor{box-shadow:inset 0 4px 0 #5eb8ff}.bar.current{box-shadow:inset 0 -4px 0 #27a66f}.bar.selected.current{background:#176342}.bar-number{display:block;padding-top:7px;pointer-events:none}.bar-time{display:block;font-size:9px;font-weight:500;color:#8f9aa8;margin-top:3px;pointer-events:none}.bar.selected .bar-time{color:#d8ecff}.beat{position:relative;flex:0 0 48px;min-width:48px;height:58px;border:0;border-right:1px solid #343b45;border-radius:0;background:#20262e;color:#cbd3dd;padding:0 3px;font-size:11px;font-weight:700;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}.beat:nth-child(4n+1){background:#252c35}.beat:hover{background:#303a46}.beat.selected{background:#155c91;color:#fff}.beat.loop-start-pending{background:#176dcc;color:#fff;box-shadow:inset 0 4px 0 #8ed0ff}.beat.loop-start-pending .beat-time{color:#e6f3ff}.beat.anchor{box-shadow:inset 0 4px 0 #5eb8ff}.beat.current{box-shadow:inset 0 -4px 0 #27a66f}.beat.selected.current{background:#176342}.beat-number{display:block;padding-top:7px;pointer-events:none}.beat-time{display:block;font-size:9px;font-weight:500;color:#8f9aa8;margin-top:3px;pointer-events:none}.beat.selected .beat-time{color:#d8ecff}.timeline-nav{display:flex;gap:8px;margin-top:8px}.timeline-nav button{flex:1;min-height:44px}.timeline-point-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.timeline-point-controls button{min-height:52px}.timeline-point-controls button.active{background:#155c91;border-color:#5eb8ff;box-shadow:0 0 0 2px rgba(94,184,255,.22) inset}.timeline-point-status{margin-top:7px;padding:8px 10px;border-radius:8px;background:#11161c;color:#cbd3dd;font-size:12px;text-align:center;min-height:34px;display:flex;align-items:center;justify-content:center}.timeline-view{color:var(--muted);font-size:12px;text-align:center;min-width:110px;display:flex;align-items:center;justify-content:center}.timeline-loop-control{margin-top:8px}.timeline-loop-control button{width:100%;min-height:48px}.timeline-help{margin-top:7px;color:var(--muted);font-size:12px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.hero h1{font-size:clamp(22px,4vw,34px);margin:0}.hero p{margin:4px 0 0;color:var(--muted);overflow-wrap:anywhere}.hero-actions{display:flex;gap:8px;flex-wrap:wrap}.hero-actions button{flex:1 1 150px}.statusbox{background:#090b0e;border:1px solid var(--border);border-radius:10px;padding:11px 13px;min-height:46px;margin-bottom:12px;color:#dbe2ea}.player{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}.time{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:750;font-size:18px}.playergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.cards{display:block}.category{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}.category>summary{list-style:none;cursor:pointer;min-height:54px;padding:15px 16px;font-size:17px;font-weight:750;display:flex;align-items:center;justify-content:space-between;touch-action:manipulation}.category>summary::-webkit-details-marker{display:none}.category>summary::after{content:'▾';color:var(--muted);font-size:18px}.category:not([open])>summary::after{content:'▸'}.category>summary:active{background:var(--panel2)}.category-content{padding:0 14px 14px}.category[open]>summary{border-bottom:1px solid var(--border)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.value{text-align:center;font-size:27px;font-weight:800;margin:0 0 8px;font-variant-numeric:tabular-nums}.muted{color:var(--muted);font-size:13px;text-align:center;margin:7px 0}.sep{height:1px;background:var(--border);margin:12px 0}.markergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.hidden-statu @media(max-width:700px){body{padding:7px}.hero{display:block}.hero-actions{margin-top:10px}.cards{grid-template-columns:1fr}.playergrid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.markergrid{grid-template-columns:repeat(2,minmax(0,1fr))}button,select{min-height:56px}}

.timeline-selector-row{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;align-items:stretch}.timeline-selector-wrap{min-width:0}.loop-icon-button,.square-icon-button{width:58px;height:58px;min-width:58px;min-height:58px;padding:0;display:flex;align-items:center;justify-content:center;font-size:27px;line-height:1;border-radius:10px}.loop-icon-button{background:var(--panel2);border-color:var(--border)}.loop-icon-button.loop-on{background:#176342;border-color:#2b9e70;box-shadow:inset 0 0 0 2px #5eb8ff}.main-controls{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}.main-controls>input[type=range]{display:block;margin:0 0 10px}.transport-row,.section-nav-row,.square-button-row{display:flex;gap:8px}.transport-row{justify-content:center;margin-bottom:10px;align-items:center}.square-icon-button{font-size:24px}.section-icon-button{width:58px;height:58px;min-width:58px;min-height:58px;padding:0;display:flex;align-items:center;justify-content:center;font-size:25px;border-radius:10px}.playback-time{display:flex;justify-content:center;align-items:center;gap:6px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin:0 0 4px}.bpm-reset{font-size:22px}.wide-control{flex:1;min-height:48px}.section-nav-row{margin-bottom:12px}.bpm-control-row,.transpose-control-row{padding-top:10px;border-top:1px solid var(--border);margin-top:10px}.control-label{font-size:15px;font-weight:700;text-align:center;margin-bottom:8px}.control-label strong{font-variant-numeric:tabular-nums}.square-control{width:58px;height:58px;min-width:58px;min-height:58px;padding:0;display:flex;align-items:center;justify-content:center;font-size:17px}.square-button-row{justify-content:center;flex-wrap:wrap}.fullscreen-button{width:52px!important;min-width:52px!important;height:52px;min-height:52px!important;padding:0!important;font-size:27px!important;flex:0 0 52px!important}.hero-actions{align-items:flex-start}.hero-actions button{flex:0 0 auto}.hero-actions #uiMidi,.hero-actions #uiSf2{flex:0 1 auto}@media(max-width:600px){.timeline-selector-row{grid-template-columns:52px minmax(0,1fr)}.loop-icon-button,.square-icon-button,.section-icon-button{width:52px;height:52px;min-width:52px;min-height:52px}.square-control{width:52px;height:52px;min-width:52px;min-height:52px}}

<body>
<div id="midiGraphicalUI">
  <div class="hero">
    <div><h1>🎹 MIDI Karaoke App</h1><p id="uiFile">No MIDI loaded</p></div>
    <div class="hero-actions"><button id="uiMidi">Import MIDI</button><button id="uiSf2">Import SoundFont</button><button id="uiFull" class="fullscreen-button" aria-label="Fullscreen" title="Fullscreen">⛶</button></div>
  </div>
  <section id="midiTimelineCard">
    <div class="timeline-head"><strong>🎼 Song Timeline / Loop Selection</strong><span id="uiTimelineInfo"></span></div>
    <div class="timeline-selector-row">
      <button id="loopToggle" class="loop-icon-button" aria-label="Toggle Loop / Repeat" title="Toggle Loop / Repeat">🔁</button>
      <div class="timeline-selector-wrap">
        <div id="midiTimeline" class="timeline empty">Load a MIDI file to show the song beats.</div>
        <div class="timeline-view" id="timelineView">All beats</div>
      </div>
    </div>
  </section>

  <section class="main-controls">
    <div class="playback-time"><span id="uiNow">0:00</span><span>/</span><span id="uiDur">0:00</span></div>
    <input id="uiSeek" type="range" min="0" max="0" step="0.01" value="0" aria-label="Playback position">
    <div class="transport-row">
      <button id="uiPlay" class="primary square-icon-button" aria-label="Play / Pause" title="Play / Pause">⏯️</button>
      <button id="uiStop" class="danger square-icon-button" aria-label="Stop" title="Stop">⏹️</button>
      <button id="prev" class="section-icon-button" aria-label="Previous Section / Marker" title="Previous Section / Marker">⬅️</button>
      <button id="next" class="section-icon-button" aria-label="Next Section / Marker" title="Next Section / Marker">➡️</button>
    </div>
    <div class="bpm-control-row">
      <div class="control-label">BPM <strong id="uiBpm">—</strong></div>
      <div class="square-button-row">
        <button id="bpmM5" class="square-control" aria-label="BPM minus 5">−5</button>
        <button id="bpmM1" class="square-control" aria-label="BPM minus 1">−1</button>
        <button id="bpmOrig" class="square-control bpm-reset" aria-label="Reset BPM to original" title="Reset BPM to Original">↺</button>
        <button id="bpmP1" class="square-control" aria-label="BPM plus 1">+1</button>
        <button id="bpmP5" class="square-control" aria-label="BPM plus 5">+5</button>
      </div>
    </div>
    <div class="transpose-control-row">
      <div class="control-label">Transpose <strong id="uiTranspose">0</strong></div>
      <div class="square-button-row">
        <button id="trDown" class="square-control" aria-label="Transpose down one semitone">−1</button>
        <button id="trReset" class="square-control" aria-label="Reset transpose">0</button>
        <button id="trUp" class="square-control" aria-label="Transpose up one semitone">+1</button>
      </div>
    </div>
  </section>

  <div id="uiStatus" class="statusbox">Ready.</div>
  <div class="cards">
    <details class="category">
      <summary>🎵 Songs</summary>
      <div class="category-content"><button id="uiSave" class="good" style="width:100%">Save Song As…</button><div style="height:8px"></div><select id="uiSongs"><option value="">Loading saved songs…</option></select><div style="height:8px"></div><div class="grid2"><button id="uiLoad">Load Selected</button><button id="uiDelete" class="danger">Delete Selected</button></div><div style="height:8px"></div><button id="uiJson" style="width:100%">Import Song JSON</button></div>
    </details>
    <details class="category">
      <summary>🕒 Timestamps</summary>
      <div class="category-content"><div class="grid3"><button id="tsPL">P + L</button><button id="tsL">Line</button><button id="tsRemove" class="danger">Remove</button></div></div>
    </details>
  </div>
    <pre id="status" class="hidden-status"></pre>
</div>

<script>
'use strict';

/*
  MIDI-ONLY CONTROLLER — VERSION 1204

  Intentionally minimal:
  - no CSS
  - no buttons
  - no panels
  - keyboard controlled
  - plain text only
  - standalone HTML

  Current shortcuts:
    Home           MIDI Play / Pause
    Delete         Remove the current line's timestamp
    ,              MIDI Stop

    Up Arrow       Transpose MIDI +1 semitone
    Down Arrow     Transpose MIDI -1 semitone

    Right Arrow    MIDI BPM +5
    Left Arrow     MIDI BPM -5
    Shift+Right    MIDI BPM +1
    Shift+Left     MIDI BPM -1
    0              MIDI original BPM

    1              Jump to 'Verse 1' rehearsal mark
    2              Jump to 'Chorus 1' rehearsal mark

    F1             Show shortcut information

    F3             Import MIDI file...
    F4             Import SoundFont...

    F5             Save Song As...
    F9             Open Saved Songs...

    F11            Full Screen

    P              Record a 'song Part' + 'first line in that Part' timestamps
    L              Record a 'Line timestamp
    Delete         Remove the current line's timestamp

  Communication:
    BroadcastChannel
    localStorage event
    window.opener.postMessage()

  The main Karaoke Band app will later be modified to receive these
  commands. This version can already run the MIDI engine independently.
*/

const statusEl = document.getElementById('status');

const shortcuts = {
  'Home': 'MIDI Play / Pause',
  'Delete': "Remove the current line's timestamp",
  ',': 'Move Loop / Repeat Range left by 1 Bar',
  'Up Arrow': 'Transpose MIDI +1 semitone',
  'Down Arrow': 'Transpose MIDI -1 semitone',
  'Right Arrow': 'MIDI BPM +5',
  'Left Arrow': 'MIDI BPM -5',
  'Shift+Right Arrow': 'MIDI BPM +1',
  'Shift+Left Arrow': 'MIDI BPM -1',
  '0': 'MIDI original BPM',
  'F1': 'Show shortcut information',
  'F3': 'Import MIDI file...',
  'F4': 'Import SoundFont...',
  'F5': 'Save Song As...',
  'F9': 'Open Saved Songs...',
  'F11': 'Full Screen',
  'P': "Record a 'song Part' + 'first line in that Part' timestamps",
  'L': "Record a 'Line timestamp",
  '[': 'Set Loop Start Point',
  ']': 'Set Loop End Point',
  'R': 'Toggle Loop / Repeat',
  '=': 'Raise Loop Start by 1 Beat',
  '-': 'Lower Loop Start by 1 Beat',
  'Page Down': 'Jump to Previous MIDI Marker',
  '.': 'Move Loop / Repeat Range left by 1 Bar',
  'Page Up': 'MIDI Stop',
  'End': 'Jump to Next MIDI Marker',
  'Enter': 'Jump to Current Section Start',
  '`': 'Jump to Song Beginning and Start Playback',
  'Space': 'Stop / Start at Current Section Start',
  '1': 'Jump to 1st MIDI Marker',
  '2': 'Jump to 2nd MIDI Marker',
  '3': 'Jump to 3rd MIDI Marker',
  '4': 'Jump to 4th MIDI Marker',
  '5': 'Jump to 5th MIDI Marker',
  '6': 'Jump to 6th MIDI Marker',
  '7': 'Jump to 7th MIDI Marker',
  '8': 'Jump to 8th MIDI Marker',
  '9': 'Jump to 9th MIDI Marker'
};

function shortcutText() {
  return [
    'MIDI Karaoke App',
    '',
    'Home          ' + shortcuts.Home,
    'Delete        ' + shortcuts.Delete,
    ',             ' + shortcuts[','],
    '',
    'Up Arrow      ' + shortcuts['Up Arrow'],
    'Down Arrow    ' + shortcuts['Down Arrow'],
    '',
    'Right Arrow   ' + shortcuts['Right Arrow'],
    'Left Arrow    ' + shortcuts['Left Arrow'],
    'Shift+Right Arrow    ' + shortcuts['Shift+Right Arrow'],
    'Shift+Left Arrow     ' + shortcuts['Shift+Left Arrow'],
    '0             ' + shortcuts['0'],
    '1             ' + shortcuts['1'],
    '2             ' + shortcuts['2'],
    '',
    '[             ' + shortcuts['['],
    ']             ' + shortcuts[']'],
    'R             ' + shortcuts.R,
    '=             ' + shortcuts['='],
    '-             ' + shortcuts['-'],
    'Page Down     ' + shortcuts['Page Down'],
    '.             ' + shortcuts['.'],
    'Page Up       ' + shortcuts['Page Up'],
    'End           ' + shortcuts.End,
    'Space         ' + shortcuts.Space,
    '`             ' + shortcuts['`'],
    '1             ' + shortcuts['1'],
    '2             ' + shortcuts['2'],
    '3             ' + shortcuts['3'],
    '4             ' + shortcuts['4'],
    '5             ' + shortcuts['5'],
    '6             ' + shortcuts['6'],
    '7             ' + shortcuts['7'],
    '8             ' + shortcuts['8'],
    '9             ' + shortcuts['9'],
    '',
    'Alternative Shortcuts',
    'W             Same as Up Arrow',
    'A             Same as Left Arrow',
    'S             Same as Down Arrow',
    'D             Same as Right Arrow',
    'Q             Same as [',
    'E             Same as ]',
    'Z             Same as P',
    'X             Same as Delete',
    'C             Same as L',
    '',
    'F1            ' + shortcuts.F1,
    '',
    'F3            ' + shortcuts.F3,
    'F4            ' + shortcuts.F4,
    '',
    'F5            ' + shortcuts.F5,
    'F9            ' + shortcuts.F9,
    '',
    'F11           ' + shortcuts.F11,
    '',
    'P             ' + shortcuts.P,
    'L             ' + shortcuts.L,
    ',             ' + shortcuts[',']
  ].join('\n');
}

function formatTime(seconds, milliseconds) {
  seconds = Math.max(0, Number(seconds) || 0);
  const whole = Math.floor(seconds);
  const minutes = Math.floor(whole / 60);
  const secs = whole % 60;
  const ms = Math.floor((seconds - whole) * 1000);

  if (milliseconds) {
    return minutes + ':' +
      String(secs).padStart(2, '0') + '.' +
      String(ms).padStart(3, '0');
  }

  return minutes + ':' + String(secs).padStart(2, '0');
}

let midiStatusMessage = '';

function midiGetStructuralMarkers() {
  return midiPlayback.rehearsalMarks.filter(function(mark) {
    return mark.markerType === 'marker' || mark.markerType === 'cuePoint';
  });
}

function midiGetCurrentStructuralMarker() {
  const currentSeconds = midiGetCurrentTime();
  const markers = midiGetStructuralMarkers();
  let current = null;

  for (let i = 0; i < markers.length; i++) {
    if (markers[i].seconds <= currentSeconds + 0.000001) {
      current = markers[i];
    } else {
      break;
    }
  }

  return current;
}

function midiGetDisplayedSectionMarks() {
  const structuralMarks = midiGetStructuralMarkers();
  const sourceMarks = structuralMarks.length
    ? structuralMarks
    : midiPlayback.rehearsalMarks;
  const seenNames = Object.create(null);
  const displayed = [];

  sourceMarks.forEach(function(mark) {
    const name = String(mark.text || '').trim();
    const key = name.toLowerCase();
    if (!name || seenNames[key]) return;

    seenNames[key] = true;
    displayed.push(mark);
  });

  return displayed;
}

function setStatus(message) {
  if (typeof message === 'string') {
    midiStatusMessage = message;
  }

  const displayedMarks = midiGetDisplayedSectionMarks();
  const currentMarker = midiGetCurrentStructuralMarker();
  const markLines = [];

  displayedMarks.forEach(function(mark) {
    const name = String(mark.text || '').trim();
    const key = name.toLowerCase();

    const isCurrent = currentMarker &&
      currentMarker.text.trim().toLowerCase() === key;

    markLines.push(
      (isCurrent ? '> ' : '  ') +
      name + ' (' + formatTime(mark.seconds, true) + ')'
    );
  });

  statusEl.textContent =
    (midiStatusMessage ? midiStatusMessage + '\n\n' : '') +
    'MIDI Time: ' +
    formatTime(midiGetCurrentTime(), true) +
    ' / ' +
    formatTime(midiPlayback.durationSeconds, true) +
    '\n\nBPM: ' +
    Math.round(midiPlayback.bpm) +
    '\n\nTranspose: ' +
    (midiPlayback.transposeSemitones >= 0 ? '+' : '') +
    midiPlayback.transposeSemitones +
    '\n\nLooping: ' +
    (midiPlayback.looping ? 'On' : 'Off') +
    '\nLoop Starts: ' +
    (midiPlayback.loopStartSeconds === null
      ? 'Bar ? | Beat ?'
      : midiGetBarBeatLabelForSeconds(midiPlayback.loopStartSeconds)) +
    '\nLoop Ends: ' +
    (midiPlayback.loopEndSeconds === null
      ? 'Bar ? | Beat ?'
      : midiGetBarBeatLabelForSeconds(midiPlayback.loopEndSeconds)) +
    (markLines.length ? '\n\nSection Marks:\n' + markLines.join('\n') : '') +
    midiSavedSongListText();
}

/* =========================================================
   COMMUNICATION WITH MAIN KARAOKE BAND APP
   ========================================================= */

const CHANNEL_NAME = 'karaoke-band-midi-controller-v1';
let commandChannel = null;

try {
  commandChannel = new BroadcastChannel(CHANNEL_NAME);
} catch (e) {
  commandChannel = null;
}

function sendCommand(command, data) {
  const message = Object.assign({
    source: 'midi-controller',
    type: 'midi-command',
    command: command,
    sentAt: Date.now()
  }, data || {});

  if (commandChannel) {
    try {
      commandChannel.postMessage(message);
    } catch (e) {}
  }

  try {
    localStorage.setItem(
      'karaokeBandMidiCommand',
      JSON.stringify(message)
    );
  } catch (e) {}

  if (window.opener && !window.opener.closed) {
    try {
      window.opener.postMessage(message, '*');
    } catch (e) {}
  }
}

/* =========================================================
   MIDI STORAGE
   ========================================================= */

const MIDI_DB_NAME = 'karaokeBandMidiController';
const MIDI_DB_VERSION = 2;
const MIDI_STORE = 'midi';
const MIDI_SONG_STORE = 'songs';
const MIDI_ACTIVE_KEY = 'karaokeBandMidiControllerActiveMIDI';
let midiDbPromise = null;

/* The minimal controller has no visible BPM readout element.
   Keep this function as a safe compatibility hook for restore/playback code. */
function midiUpdateBpmReadout() {
  return;
}
function midiDbOpen() {
  if (midiDbPromise) return midiDbPromise;

  midiDbPromise = new Promise(function(resolve, reject) {
    const request = indexedDB.open(MIDI_DB_NAME, MIDI_DB_VERSION);

    request.onupgradeneeded = function() {
      const db = request.result;
      if (!db.objectStoreNames.contains(MIDI_STORE)) {
        db.createObjectStore(MIDI_STORE, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(MIDI_SONG_STORE)) {
        db.createObjectStore(MIDI_SONG_STORE, { keyPath: 'id' });
      }
    };

    request.onsuccess = function() {
      const db = request.result;

      db.onversionchange = function() {
        try { db.close(); } catch (e) {}
        midiDbPromise = null;
      };

      db.onclose = function() {
        midiDbPromise = null;
      };

      resolve(db);
    };

    request.onerror = function() {
      midiDbPromise = null;
      reject(request.error);
    };
  });

  return midiDbPromise;
}

function midiDbPut(record) {
  return midiDbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      const tx = db.transaction(MIDI_STORE, 'readwrite');
      tx.objectStore(MIDI_STORE).put(record);
      tx.oncomplete = function() { resolve(true); };
      tx.onerror = function() { reject(tx.error); };
      tx.onabort = function() {
        reject(tx.error || new Error('MIDI storage transaction aborted.'));
      };
    });
  });
}

function midiDbGet(id) {
  return midiDbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      const tx = db.transaction(MIDI_STORE, 'readonly');
      const request = tx.objectStore(MIDI_STORE).get(id);

      request.onsuccess = function() {
        resolve(request.result || null);
      };

      request.onerror = function() {
        reject(request.error);
      };
    });
  });
}

function midiSongDbPut(record) {
  return midiDbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      const tx = db.transaction(MIDI_SONG_STORE, 'readwrite');
      tx.objectStore(MIDI_SONG_STORE).put(record);
      tx.oncomplete = function() { resolve(true); };
      tx.onerror = function() { reject(tx.error); };
      tx.onabort = function() {
        reject(tx.error || new Error('Song storage transaction aborted.'));
      };
    });
  });
}

function midiSongDbGetAll() {
  return midiDbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      const tx = db.transaction(MIDI_SONG_STORE, 'readonly');
      const request = tx.objectStore(MIDI_SONG_STORE).getAll();
      request.onsuccess = function() {
        resolve(Array.isArray(request.result) ? request.result : []);
      };
      request.onerror = function() {
        reject(request.error);
      };
    });
  });
}

function midiSongDbDelete(id) {
  return midiDbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      const tx = db.transaction(MIDI_SONG_STORE, 'readwrite');
      tx.objectStore(MIDI_SONG_STORE).delete(id);
      tx.oncomplete = function() { resolve(true); };
      tx.onerror = function() { reject(tx.error); };
      tx.onabort = function() {
        reject(tx.error || new Error('Song deletion transaction aborted.'));
      };
    });
  });
}

let midiSongListOpen = false;
let midiSongList = [];
let midiSongListIndex = 0;

function midiFormatSavedSongDate(value) {
  if (!value) return '';
  try {
    const date = new Date(value);
    return Number.isFinite(date.getTime()) ? date.toLocaleString() : '';
  } catch (e) {
    return '';
  }
}

async function midiRefreshSavedSongList() {
  midiSongList = await midiSongDbGetAll();
  midiSongList.sort(function(a, b) {
    return String(b.savedAt || '').localeCompare(String(a.savedAt || ''));
  });
  if (midiSongListIndex >= midiSongList.length) {
    midiSongListIndex = Math.max(0, midiSongList.length - 1);
  }
  setStatus(midiStatusMessage);
}

async function midiRememberSong(song, fileName) {
  await midiSongDbPut({
    id: 'song-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10),
    name: fileName || song.midiFile || 'Untitled MIDI.midi-song.json',
    song: song,
    savedAt: new Date().toISOString()
  });
}

function midiSavedSongListText() {
  if (!midiSongListOpen) return '';

  if (!midiSongList.length) {
    return [
      '',
      '',
      '------------',
      'Saved Songs:',
      '  (No saved Songs yet.)',
      '',
      'I = Import Song JSON',
      'Esc = Close'
    ].join('\n');
  }

  const lines = ['', '', '------------', 'Saved Songs:'];
  midiSongList.forEach(function(record, index) {
    const selected = index === midiSongListIndex;
    const dateText = midiFormatSavedSongDate(record.savedAt);
    lines.push(
      (selected ? '> ' : '  ') +
      (index + 1) + '. ' +
      String(record.name || 'Untitled Song') +
      (dateText ? ' (' + dateText + ')' : '')
    );
  });
  lines.push('');
  lines.push('Up/Down = Select');
  lines.push('Enter = Load');
  lines.push('Delete = Remove');
  lines.push('I = Import Song JSON');
  lines.push('Esc = Close');
  return lines.join('\n');
}

async function midiLoadStoredSong(record) {
  const song = record && record.song;
  if (!song || song.type !== 'midi-song' || song.version !== 1) {
    throw new Error('This is not a supported MIDI Song.');
  }
  if (typeof song.midiDataBase64 !== 'string') {
    throw new Error('Saved Song does not contain MIDI data.');
  }

  const buffer = midiBase64ToArrayBuffer(song.midiDataBase64);
  const parsed = midiParse(buffer);
  const midiName = song.midiFile || 'Untitled MIDI';

  const midiRecord = {
    id: 'midi-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10),
    name: midiName,
    type: 'audio/midi',
    size: buffer.byteLength,
    data: buffer,
    savedAt: new Date().toISOString()
  };

  await midiDbPut(midiRecord);
  localStorage.setItem(MIDI_ACTIVE_KEY, midiRecord.id);
  midiLoadParsed(parsed, midiName, buffer);

  if (Number.isFinite(song.bpm)) midiPlayback.bpm = Math.max(5, song.bpm);
  if (Number.isFinite(song.transpose)) midiPlayback.transposeSemitones = song.transpose;

  midiPlayback.loopStartSeconds = null;
  midiPlayback.loopEndSeconds = null;

  if (Number.isFinite(song.loopStartSeconds)) {
    midiPlayback.loopStartSeconds = Math.max(
      0, Math.min(song.loopStartSeconds, midiPlayback.durationSeconds)
    );
  }

  if (Number.isFinite(song.loopEndSeconds) &&
      midiPlayback.loopStartSeconds !== null &&
      song.loopEndSeconds > midiPlayback.loopStartSeconds) {
    midiPlayback.loopEndSeconds = Math.max(
      midiPlayback.loopStartSeconds,
      Math.min(song.loopEndSeconds, midiPlayback.durationSeconds)
    );
  }

  midiPlayback.looping = Boolean(
    song.looping &&
    midiPlayback.loopStartSeconds !== null &&
    midiPlayback.loopEndSeconds !== null &&
    midiPlayback.loopEndSeconds > midiPlayback.loopStartSeconds
  );

  midiUpdateBpmReadout();
  sendCommand('midi-loaded', {
    name: midiName,
    song: true,
    bpm: midiPlayback.bpm,
    transpose: midiPlayback.transposeSemitones
  });
  setStatus('Song loaded: ' + midiName);
}

async function midiOpenSavedSongList() {
  midiSongListOpen = true;
  midiSongListIndex = 0;
  try {
    await midiRefreshSavedSongList();
  } catch (error) {
    midiSongList = [];
    setStatus('Could not open Saved Songs: ' + (error.message || error));
  }
}

function midiCloseSavedSongList() {
  midiSongListOpen = false;
  setStatus(midiStatusMessage);
}

async function midiHandleSavedSongListKey(key) {
  if (!midiSongListOpen) return false;

  if (key === 'F9' || key === 'Escape') {
    midiCloseSavedSongList();
    return true;
  }

  if (key === 'ArrowUp' || key === 'ArrowDown') {
    if (midiSongList.length) {
      const delta = key === 'ArrowUp' ? -1 : 1;
      midiSongListIndex =
        (midiSongListIndex + delta + midiSongList.length) %
        midiSongList.length;
      setStatus(midiStatusMessage);
    }
    return true;
  }

  if (key === 'Enter') {
    if (!midiSongList.length) return true;
    const record = midiSongList[midiSongListIndex];
    try {
      await midiLoadStoredSong(record);
      midiSongListOpen = false;
    } catch (error) {
      setStatus('Saved Song load error: ' + (error.message || error));
    }
    return true;
  }

  if (key === 'Delete') {
    if (!midiSongList.length) return true;
    const record = midiSongList[midiSongListIndex];
    try {
      await midiSongDbDelete(record.id);
      midiSongList.splice(midiSongListIndex, 1);
      midiSongListIndex = Math.min(
        midiSongListIndex,
        Math.max(0, midiSongList.length - 1)
      );
      setStatus(midiStatusMessage);
    } catch (error) {
      setStatus('Could not remove saved Song: ' + (error.message || error));
    }
    return true;
  }

  if (key.toLowerCase() === 'i') {
    midiSongListOpen = false;
    midiLoadSongPicker();
    return true;
  }

  return true;
}

async function midiRestoreActive() {
  const activeId = localStorage.getItem(MIDI_ACTIVE_KEY);

  if (!activeId) return;

  try {
    const record = await midiDbGet(activeId);

    if (!record || !record.data) {
      localStorage.removeItem(MIDI_ACTIVE_KEY);
      return;
    }

    const parsed = midiParse(record.data);

    midiLoadParsed(
      parsed,
      record.name || 'Untitled MIDI',
      record.data
    );

    midiUpdateBpmReadout();

    setStatus(
      'MIDI restored: ' +
      (record.name || 'Untitled MIDI')
    );

    sendCommand('midi-loaded', {
      name: record.name || 'Untitled MIDI',
      restored: true
    });
  } catch (error) {
    console.error(
      '[midi] Could not restore saved MIDI:',
      error
    );

    setStatus(
      'Could not restore saved MIDI: ' +
      (error.message || error)
    );
  }
}

/* =========================================================
   SONG FILES
   A Song JSON is a self-contained bundle: it contains the MIDI
   data plus the current BPM and transpose settings. This makes
   Load Song a true one-file operation in the browser.
   ========================================================= */

function midiArrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  const chunkSize = 0x8000;

  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(
      null,
      bytes.subarray(i, Math.min(i + chunkSize, bytes.length))
    );
  }

  return btoa(binary);
}

function midiBase64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  return bytes.buffer;
}

async function midiSaveSong() {
  if (!midiPlayback.parsed || !midiPlayback.rawData) {
    setStatus('No MIDI loaded.');
    return;
  }

  try {
    const midiData = midiPlayback.rawData;
    const midiName = midiPlayback.fileName || 'Untitled MIDI';

    const song = {
      type: 'midi-song',
      version: 1,
      midiFile: midiName,
      bpm: midiPlayback.bpm,
      transpose: midiPlayback.transposeSemitones,
      loopStartSeconds: midiPlayback.loopStartSeconds,
      loopEndSeconds: midiPlayback.loopEndSeconds,
      looping: midiPlayback.looping,
      midiDataBase64: midiArrayBufferToBase64(midiData)
    };

    const json = JSON.stringify(song, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const baseName = midiName.replace(/\.[^.]+$/, '') || 'Untitled MIDI';
    const suggestedName = baseName + '.midi-song.json';

    /*
       Use the browser's real Save As dialog when the File System Access
       API is available. The picker is opened directly from the keyboard
       shortcut, so the browser treats it as a user-initiated save.
    */
    if (typeof window.showSaveFilePicker === 'function') {
      const handle = await window.showSaveFilePicker({
        suggestedName: suggestedName,
        types: [{
          description: 'MIDI Song JSON',
          accept: { 'application/json': ['.json'] }
        }]
      });

      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();

      try {
        await midiRememberSong(song, handle.name || suggestedName);
      } catch (storageError) {
        console.error('[midi] Could not remember saved song:', storageError);
      }

      setStatus('Song saved: ' + (handle.name || suggestedName));
      return;
    }

    /* Fallback for browsers that do not support showSaveFilePicker. */
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = suggestedName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);

    try {
      await midiRememberSong(song, suggestedName);
    } catch (storageError) {
      console.error('[midi] Could not remember saved song:', storageError);
    }

    setStatus('Song saved: ' + suggestedName);
  } catch (error) {
    if (error && error.name === 'AbortError') {
      setStatus('Song save cancelled.');
      return;
    }

    console.error('[midi] Could not save song:', error);
    setStatus('Song save error: ' + (error.message || error));
  }
}

function midiLoadSongPicker() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';

  input.onchange = function(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    file.text().then(async function(text) {
      let song;

      try {
        song = JSON.parse(text);
      } catch (error) {
        throw new Error('Invalid Song JSON file.');
      }

      if (!song || song.type !== 'midi-song' || song.version !== 1) {
        throw new Error('This is not a supported MIDI Song file.');
      }

      if (typeof song.midiDataBase64 !== 'string') {
        throw new Error('Song file does not contain MIDI data.');
      }

      const buffer = midiBase64ToArrayBuffer(song.midiDataBase64);
      const parsed = midiParse(buffer);
      const midiName = song.midiFile || 'Untitled MIDI';

      const record = {
        id: 'midi-' + Date.now() + '-' +
          Math.random().toString(36).slice(2, 10),
        name: midiName,
        type: 'audio/midi',
        size: buffer.byteLength,
        data: buffer,
        savedAt: new Date().toISOString()
      };

      await midiDbPut(record);
      localStorage.setItem(MIDI_ACTIVE_KEY, record.id);

      midiLoadParsed(parsed, midiName, buffer);

      if (Number.isFinite(song.bpm)) {
        midiPlayback.bpm = Math.max(5, song.bpm);
      }

      if (Number.isFinite(song.transpose)) {
        midiPlayback.transposeSemitones = song.transpose;
      }

      if (Number.isFinite(song.loopStartSeconds)) {
        midiPlayback.loopStartSeconds = Math.max(
          0,
          Math.min(song.loopStartSeconds, midiPlayback.durationSeconds)
        );
      }

      if (Number.isFinite(song.loopEndSeconds) &&
          midiPlayback.loopStartSeconds !== null &&
          song.loopEndSeconds > midiPlayback.loopStartSeconds) {
        midiPlayback.loopEndSeconds = Math.max(
          midiPlayback.loopStartSeconds,
          Math.min(song.loopEndSeconds, midiPlayback.durationSeconds)
        );
      }

      midiPlayback.looping = Boolean(
        song.looping &&
        midiPlayback.loopStartSeconds !== null &&
        midiPlayback.loopEndSeconds !== null &&
        midiPlayback.loopEndSeconds > midiPlayback.loopStartSeconds
      );

      midiUpdateBpmReadout();

      sendCommand('midi-loaded', {
        name: midiName,
        song: true,
        bpm: midiPlayback.bpm,
        transpose: midiPlayback.transposeSemitones
      });

      setStatus('Song loaded: ' + midiName);
    }).catch(function(error) {
      console.error('[midi] Could not load song:', error);
      setStatus('Song load error: ' + (error.message || error));
    });
  };

  input.click();
}

function midiOpenFilePicker() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.mid,.midi,audio/midi,audio/x-midi';

  input.onchange = function(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    file.arrayBuffer().then(function(buffer) {
      const parsed = midiParse(buffer);

      const record = {
        id: 'midi-' + Date.now() + '-' +
          Math.random().toString(36).slice(2, 10),
        name: file.name || 'Untitled MIDI',
        type: file.type || 'audio/midi',
        size: file.size || buffer.byteLength,
        data: buffer,
        savedAt: new Date().toISOString()
      };

      return midiDbPut(record).then(function() {
        localStorage.setItem(MIDI_ACTIVE_KEY, record.id);

        midiLoadParsed(parsed, record.name, buffer);

        midiUpdateBpmReadout();

        sendCommand('midi-loaded', {
          name: record.name
        });
      });
    }).catch(function(error) {
      console.error('[midi] Could not open MIDI:', error);
      setStatus('MIDI error: ' + (error.message || error));
    });
  };

  input.click();
}

/* =========================================================
   MIDI PARSER
   =========================================================
   Directly based on the parser in the current 3566 app.
*/

function midiReadUint16(view, offset) {
  return view.getUint16(offset, false);
}

function midiReadUint32(view, offset) {
  return view.getUint32(offset, false);
}

function midiReadVarLen(view, offset) {
  let value = 0;
  let bytes = 0;

  while (offset + bytes < view.byteLength) {
    const b = view.getUint8(offset + bytes);
    value = (value << 7) | (b & 0x7f);
    bytes++;

    if (!(b & 0x80)) {
      return { value: value, bytes: bytes };
    }

    if (bytes >= 4) break;
  }

  throw new Error('Invalid MIDI variable-length value.');
}

    function midiParse(buffer) {
      const view = new DataView(buffer);

      if (view.byteLength < 14) {
        throw new Error('MIDI file is too small.');
      }

      function midiChunkId(offset) {
        return String.fromCharCode(
          view.getUint8(offset),
          view.getUint8(offset + 1),
          view.getUint8(offset + 2),
          view.getUint8(offset + 3)
        );
      }

      if (midiChunkId(0) !== 'MThd') {
        throw new Error('Invalid MIDI header.');
      }

      const headerLength = midiReadUint32(view, 4);
      if (headerLength < 6 || 8 + headerLength > view.byteLength) {
        throw new Error('Invalid MIDI header length.');
      }

      const format = midiReadUint16(view, 8);
      const trackCount = midiReadUint16(view, 10);
      const division = midiReadUint16(view, 12);

      if (division & 0x8000) {
        throw new Error('SMPTE MIDI timing is not supported yet.');
      }

      const ticksPerQuarter = division & 0x7fff;
      if (!ticksPerQuarter) {
        throw new Error('Invalid MIDI ticks-per-quarter value.');
      }

      const tracks = [];
      let offset = 8 + headerLength;

      for (let trackIndex = 0; trackIndex < trackCount; trackIndex++) {
        if (offset + 8 > view.byteLength) {
          throw new Error('Unexpected end of MIDI file.');
        }

        if (midiChunkId(offset) !== 'MTrk') {
          throw new Error('Expected MIDI track chunk.');
        }

        const trackLength = midiReadUint32(view, offset + 4);
        const trackStart = offset + 8;
        const trackEnd = trackStart + trackLength;

        if (trackEnd > view.byteLength) {
          throw new Error('MIDI track extends beyond the file.');
        }

        let pos = trackStart;
        let tick = 0;
        let runningStatus = null;
        const events = [];

        while (pos < trackEnd) {
          const delta = midiReadVarLen(view, pos);
          pos += delta.bytes;
          tick += delta.value;

          if (pos >= trackEnd) break;

          let status = view.getUint8(pos);

          if (status < 0x80) {
            if (runningStatus === null) {
              throw new Error('Invalid MIDI running status.');
            }
            status = runningStatus;
          } else {
            pos++;
            if (status < 0xf0) {
              runningStatus = status;
            } else if (status !== 0xf7) {
              runningStatus = null;
            }
          }

          if (status >= 0x80 && status <= 0xef) {
            const command = status & 0xf0;
            const channel = status & 0x0f;
            const dataLength = (command === 0xc0 || command === 0xd0) ? 1 : 2;

            if (view.byteLength < pos + dataLength || pos + dataLength > trackEnd) {
              throw new Error('Unexpected end of MIDI event.');
            }

            const data1 = view.getUint8(pos);
            pos++;

            let data2 = null;
            if (dataLength === 2) {
              data2 = view.getUint8(pos);
              pos++;
            }

            if (command === 0x80 || command === 0x90) {
              events.push({
                tick: tick,
                type: command === 0x90 && data2 !== 0 ? 'noteOn' : 'noteOff',
                channel: channel,
                note: data1,
                velocity: data2 === null ? 0 : data2
              });
            } else if (command === 0xb0) {
              if (data1 === 0 || data1 === 32) {
                events.push({
                  tick: tick,
                  type: data1 === 0 ? 'bankSelectMSB' : 'bankSelectLSB',
                  channel: channel,
                  value: data2 === null ? 0 : data2
                });
              } else {
                events.push({
                  tick: tick,
                  type: 'controlChange',
                  channel: channel,
                  controller: data1,
                  value: data2 === null ? 0 : data2
                });
              }
            } else if (command === 0xc0) {
              events.push({
                tick: tick,
                type: 'programChange',
                channel: channel,
                program: data1
              });
            }

            continue;
          }

          if (status === 0xff) {
            if (pos >= trackEnd) throw new Error('Invalid MIDI meta event.');

            const metaType = view.getUint8(pos++);
            const length = midiReadVarLen(view, pos);
            pos += length.bytes;

            if (pos + length.value > trackEnd) {
              throw new Error('MIDI meta event extends beyond track.');
            }

            if (metaType === 0x51 && length.value === 3) {
              const microsecondsPerQuarter =
                (view.getUint8(pos) << 16) |
                (view.getUint8(pos + 1) << 8) |
                view.getUint8(pos + 2);

              events.push({
                tick: tick,
                type: 'tempo',
                microsecondsPerQuarter: microsecondsPerQuarter
              });
            } else if (
              metaType === 0x01 ||
              metaType === 0x06 ||
              metaType === 0x07
            ) {
              let text = '';
              for (let i = 0; i < length.value; i++) {
                text += String.fromCharCode(view.getUint8(pos + i));
              }

              events.push({
                tick: tick,
                type: 'marker',
                markerType: metaType === 0x06
                  ? 'marker'
                  : metaType === 0x07
                    ? 'cuePoint'
                    : 'text',
                text: text
              });
            }

            pos += length.value;
            continue;
          }

          if (status === 0xf0 || status === 0xf7) {
            const length = midiReadVarLen(view, pos);
            pos += length.bytes + length.value;

            if (pos > trackEnd) {
              throw new Error('Invalid MIDI system-exclusive event.');
            }

            continue;
          }

          throw new Error('Unsupported MIDI event.');
        }

        tracks.push(events);
        offset = trackEnd;
      }

      return {
        format: format,
        trackCount: trackCount,
        ticksPerQuarter: ticksPerQuarter,
        tracks: tracks
      };
    }

/* =========================================================
   SF2 STORAGE
   ========================================================= */

const SF2_DB_NAME = 'karaokeBandMidiControllerSF2';
const SF2_DB_VERSION = 1;
const SF2_STORE = 'soundfonts';
const SF2_ACTIVE_KEY = 'karaokeBandMidiControllerActiveSF2';
let sf2DbPromise = null;

function sf2DbOpen() {
  if (sf2DbPromise) return sf2DbPromise;

  sf2DbPromise = new Promise(function(resolve, reject) {
    const request = indexedDB.open(SF2_DB_NAME, SF2_DB_VERSION);

    request.onupgradeneeded = function() {
      const db = request.result;
      if (!db.objectStoreNames.contains(SF2_STORE)) {
        db.createObjectStore(SF2_STORE, { keyPath: 'id' });
      }
    };

    request.onsuccess = function() {
      const db = request.result;

      db.onversionchange = function() {
        try { db.close(); } catch (e) {}
        sf2DbPromise = null;
      };

      db.onclose = function() {
        sf2DbPromise = null;
      };

      resolve(db);
    };

    request.onerror = function() {
      sf2DbPromise = null;
      reject(request.error);
    };
  });

  return sf2DbPromise;
}

function sf2DbPut(record) {
  return sf2DbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      const tx = db.transaction(SF2_STORE, 'readwrite');
      tx.objectStore(SF2_STORE).put(record);
      tx.oncomplete = function() { resolve(true); };
      tx.onerror = function() { reject(tx.error); };
      tx.onabort = function() {
        reject(tx.error || new Error('SF2 storage transaction aborted.'));
      };
    });
  });
}

function sf2DbGet(id) {
  return sf2DbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      const tx = db.transaction(SF2_STORE, 'readonly');
      const request = tx.objectStore(SF2_STORE).get(id);

      request.onsuccess = function() {
        resolve(request.result || null);
      };

      request.onerror = function() {
        reject(request.error);
      };
    });
  });
}

function sf2OpenFilePicker() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.sf2,application/octet-stream,audio/sf2';

  input.onchange = function(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    file.arrayBuffer().then(function(buffer) {
      const record = {
        id: 'sf2-' + Date.now() + '-' +
          Math.random().toString(36).slice(2, 10),
        name: file.name || 'Untitled SF2',
        type: file.type || 'audio/sf2',
        size: file.size || buffer.byteLength,
        data: buffer,
        savedAt: new Date().toISOString()
      };

      return sf2DbPut(record).then(function() {
        localStorage.setItem(SF2_ACTIVE_KEY, record.id);
        setStatus('SoundFont loaded: ' + record.name);

        sendCommand('sf2-loaded', {
          name: record.name
        });

        sf2SynthReady = false;
        sf2SynthInitPromise = null;
        sf2Synth = null;
      });
    }).catch(function(error) {
      console.error('[sf2] Could not open SoundFont:', error);
      setStatus('SF2 error: ' + (error.message || error));
    });
  };

  input.click();
}

/* =========================================================
   SF2 SYNTH
   ========================================================= */

const SF2_SYNTH_LIB_URL =
  'https://esm.sh/spessasynth_lib@4.3.14?bundle';

const SF2_SYNTH_PROCESSOR_URL =
  'https://unpkg.com/spessasynth_lib@4.3.14/dist/spessasynth_processor.min.js';

let sf2AudioContext = null;
let sf2Synth = null;
let sf2SynthReady = false;
let sf2SynthInitPromise = null;

async function sf2EnsureSynth() {
  if (sf2SynthReady && sf2Synth) {
    return sf2Synth;
  }

  if (sf2SynthInitPromise) {
    return sf2SynthInitPromise;
  }

  sf2SynthInitPromise = (async function() {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
      throw new Error('Web Audio API is not available.');
    }

    if (!sf2AudioContext) {
      sf2AudioContext = new AudioContextClass();
    }

    if (sf2AudioContext.state === 'suspended') {
      await sf2AudioContext.resume();
    }

    const module = await import(SF2_SYNTH_LIB_URL);
    const WorkletSynthesizer = module.WorkletSynthesizer;

    if (!WorkletSynthesizer) {
      throw new Error('WorkletSynthesizer is not available.');
    }

    await sf2AudioContext.audioWorklet.addModule(
      SF2_SYNTH_PROCESSOR_URL
    );

    sf2Synth = new WorkletSynthesizer(sf2AudioContext);
    sf2Synth.connect(sf2AudioContext.destination);

    const activeId = localStorage.getItem(SF2_ACTIVE_KEY);

    if (!activeId) {
      throw new Error('No SoundFont has been loaded yet.');
    }

    const record = await sf2DbGet(activeId);

    if (!record || !record.data) {
      throw new Error('Active SoundFont could not be found.');
    }

    await sf2Synth.soundBankManager.addSoundBank(
      record.data,
      'main'
    );

    while (!sf2Synth.isReady) {
      await new Promise(function(resolve) {
        setTimeout(resolve, 50);
      });
    }

    sf2SynthReady = true;
    return sf2Synth;
  })();

  try {
    return await sf2SynthInitPromise;
  } catch (error) {
    sf2SynthInitPromise = null;
    sf2SynthReady = false;
    sf2Synth = null;
    throw error;
  }
}

/* =========================================================
   MIDI PLAYBACK
   ========================================================= */

const midiPlayback = {
  parsed: null,
  rawData: null,
  fileName: '',
  playing: false,
  pausedTimeSeconds: 0,
  startTime: 0,
  timer: null,
  activeNotes: [],
  bpm: 100,
  sourceBpm: 100,
  currentSourceBpm: 100,
  sourceBpmKnown: false,
  originalBpm: null,
  bpmAdjustment: 0,
  durationSeconds: 0,
  rehearsalMarks: [],
  transposeSemitones: 0,
  timedEvents: [],
  tempoEventSeconds: [],
  loopStartSeconds: null,
  loopEndSeconds: null,
  looping: false
};

function midiFlattenEvents(parsed) {
  if (!parsed || !Array.isArray(parsed.tracks)) return [];

  const events = [];

  parsed.tracks.forEach(function(track) {
    if (!Array.isArray(track)) return;

    track.forEach(function(event) {
      if (!event || typeof event.tick !== 'number') return;

      if (
        event.type === 'noteOn' ||
        event.type === 'noteOff' ||
        event.type === 'programChange' ||
        event.type === 'bankSelectMSB' ||
        event.type === 'bankSelectLSB' ||
        event.type === 'controlChange'
      ) {
        events.push({
          tick: event.tick,
          type: event.type,
          channel: event.channel,
          note: event.note,
          velocity: event.velocity || 0,
          program: event.program,
          controller: event.controller,
          value: event.value
        });
      }
    });
  });

  events.sort(function(a, b) {
    if (a.tick !== b.tick) return a.tick - b.tick;
    if (a.type === b.type) return 0;
    return a.type === 'noteOff' ? -1 : 1;
  });

  return events;
}

function midiGetTempoEvents(parsed) {
  const result = [];

  parsed.tracks.forEach(function(track) {
    if (!Array.isArray(track)) return;

    track.forEach(function(event) {
      if (
        event &&
        event.type === 'tempo' &&
        typeof event.tick === 'number' &&
        typeof event.microsecondsPerQuarter === 'number'
      ) {
        result.push({
          tick: event.tick,
          microsecondsPerQuarter: event.microsecondsPerQuarter
        });
      }
    });
  });

  result.sort(function(a, b) {
    return a.tick - b.tick;
  });

  if (!result.length || result[0].tick > 0) {
    result.unshift({
      tick: 0,
      microsecondsPerQuarter: 600000
    });
  }

  return result;
}

function midiTickToSecondsFactory(parsed, tempoEvents) {
  return function(targetTick) {
    let seconds = 0;
    let previousTick = 0;
    let microsecondsPerQuarter =
      tempoEvents[0].microsecondsPerQuarter;

    for (let i = 0; i < tempoEvents.length; i++) {
      const tempoEvent = tempoEvents[i];

      if (tempoEvent.tick > targetTick) break;

      if (tempoEvent.tick > previousTick) {
        seconds +=
          (tempoEvent.tick - previousTick) *
          (microsecondsPerQuarter / 1000000) /
          parsed.ticksPerQuarter;

        previousTick = tempoEvent.tick;
      }

      microsecondsPerQuarter =
        tempoEvent.microsecondsPerQuarter;
    }

    if (targetTick > previousTick) {
      seconds +=
        (targetTick - previousTick) *
        (microsecondsPerQuarter / 1000000) /
        parsed.ticksPerQuarter;
    }

    return seconds;
  };
}

function midiLoadParsed(parsed, name, rawData) {
  midiStopPlayback();

  midiPlayback.parsed = parsed;
  midiPlayback.rawData = rawData || null;
  midiPlayback.fileName = name || 'Untitled MIDI';
  midiPlayback.transposeSemitones = 0;
  midiPlayback.pausedTimeSeconds = 0;
  midiPlayback.loopStartSeconds = null;
  midiPlayback.loopEndSeconds = null;
  midiPlayback.looping = false;

  const actualTempoEvents = [];
  if (parsed && Array.isArray(parsed.tracks)) {
    parsed.tracks.forEach(function(track) {
      if (!Array.isArray(track)) return;
      track.forEach(function(event) {
        if (event && event.type === 'tempo' &&
            typeof event.microsecondsPerQuarter === 'number' &&
            typeof event.tick === 'number') {
          actualTempoEvents.push(event);
        }
      });
    });
  }
  actualTempoEvents.sort(function(a, b) { return a.tick - b.tick; });

  const tempoEvents = midiGetTempoEvents(parsed);
  const tickToSeconds =
    midiTickToSecondsFactory(parsed, tempoEvents);

  midiPlayback.sourceBpmKnown = actualTempoEvents.length > 0;
  midiPlayback.originalBpm = actualTempoEvents.length
    ? 60000000 / actualTempoEvents[0].microsecondsPerQuarter
    : null;

  midiPlayback.sourceBpm = midiPlayback.originalBpm || 100;

  midiPlayback.currentSourceBpm = midiPlayback.sourceBpm;
  midiPlayback.bpm = midiPlayback.sourceBpm;
  midiPlayback.bpmAdjustment = 0;

  midiPlayback.tempoEventSeconds = tempoEvents.map(function(event) {
    return {
      tick: event.tick,
      sourceSeconds: tickToSeconds(event.tick),
      bpm: 60000000 / event.microsecondsPerQuarter
    };
  });

  const events = midiFlattenEvents(parsed);

  midiPlayback.timedEvents = events.map(function(event) {
    return {
      event: event,
      sourceSeconds: tickToSeconds(event.tick)
    };
  });

  midiPlayback.durationSeconds =
    midiPlayback.timedEvents.length
      ? midiPlayback.timedEvents[
          midiPlayback.timedEvents.length - 1
        ].sourceSeconds
      : 0;

  midiPlayback.rehearsalMarks = [];

  if (parsed && Array.isArray(parsed.tracks)) {
    parsed.tracks.forEach(function(track) {
      if (!Array.isArray(track)) return;

      track.forEach(function(event) {
        if (
          event &&
          event.type === 'marker' &&
          typeof event.tick === 'number' &&
          typeof event.text === 'string'
        ) {
          const text = event.text.trim();
          if (!text) return;

          midiPlayback.rehearsalMarks.push({
            tick: event.tick,
            seconds: tickToSeconds(event.tick),
            text: text,
            markerType: event.markerType || 'marker'
          });
        }
      });
    });
  }

  midiPlayback.rehearsalMarks.sort(function(a, b) {
    if (a.tick !== b.tick) return a.tick - b.tick;
    return a.text.localeCompare(b.text);
  });

  setStatus('MIDI loaded: ' + midiPlayback.fileName);
}

function midiGetCurrentTime() {
  if (!midiPlayback.playing) {
    return midiPlayback.pausedTimeSeconds || 0;
  }

  const elapsed =
    (performance.now() - midiPlayback.startTime) / 1000;

  const speedScale =
    midiPlayback.sourceBpm / midiPlayback.bpm;

  return Math.min(
    elapsed / speedScale,
    midiPlayback.durationSeconds
  );
}

function midiSnapTimeToBeat(seconds) {
  if (!midiPlayback.parsed || !midiPlayback.parsed.ticksPerQuarter) {
    return Math.max(0, Math.min(seconds, midiPlayback.durationSeconds));
  }

  const tempoEvents = midiPlayback.tempoEventSeconds || [];
  const ticksPerQuarter = midiPlayback.parsed.ticksPerQuarter;

  if (!tempoEvents.length) {
    return Math.max(0, Math.min(seconds, midiPlayback.durationSeconds));
  }

  seconds = Math.max(0, Math.min(seconds, midiPlayback.durationSeconds));

  let segmentIndex = 0;
  while (
    segmentIndex + 1 < tempoEvents.length &&
    tempoEvents[segmentIndex + 1].sourceSeconds <= seconds
  ) {
    segmentIndex++;
  }

  const currentSegment = tempoEvents[segmentIndex];
  const ticksPerSecond =
    (currentSegment.bpm / 60) * ticksPerQuarter;

  const currentTick =
    currentSegment.tick +
    (seconds - currentSegment.sourceSeconds) * ticksPerSecond;

  const snappedTick =
    Math.max(
      0,
      Math.round(currentTick / ticksPerQuarter) * ticksPerQuarter
    );

  let snapSegment = tempoEvents[0];
  for (let i = 1; i < tempoEvents.length; i++) {
    if (tempoEvents[i].tick > snappedTick) break;
    snapSegment = tempoEvents[i];
  }

  const snapTicksPerSecond =
    (snapSegment.bpm / 60) * ticksPerQuarter;

  const snapSeconds =
    snapSegment.sourceSeconds +
    (snappedTick - snapSegment.tick) / snapTicksPerSecond;

  return Math.max(
    0,
    Math.min(snapSeconds, midiPlayback.durationSeconds)
  );
}

async function midiStartPlayback(startAtSourceSeconds) {
  if (!midiPlayback.parsed) {
    throw new Error('No MIDI loaded.');
  }

  const synth = await sf2EnsureSynth();

  if (!midiPlayback.timedEvents.length) {
    throw new Error('No playable MIDI events found.');
  }

  const resumeFrom = Math.max(0, Number(startAtSourceSeconds) || 0);

  if (midiPlayback.timer) {
    clearTimeout(midiPlayback.timer);
    midiPlayback.timer = null;
  }

  if (sf2Synth) {
    try {
      // Explicitly release every note before rebuilding/restarting playback.
      // This is especially important at loop boundaries, where a note can
      // legitimately extend past Loop End and therefore has no note-off
      // event before the restart point.
      const notesToRelease = midiPlayback.activeNotes.slice();

      for (const active of notesToRelease) {
        try {
          synth.noteOff(active.channel, active.note);
        } catch (e) {}
      }

      // Also clear sustain on every channel so a sustained note cannot remain
      // audible after the loop jumps back to Loop Start.
      for (let channel = 0; channel < 16; channel++) {
        try {
          synth.controllerChange(channel, 64, 0);
        } catch (e) {}
      }

      synth.stopAll();
    } catch (e) {}
  }

  midiPlayback.activeNotes = [];
  midiPlayback.playing = true;
  midiPlayback.pausedTimeSeconds = resumeFrom;

  const speedScaleAtStart = midiPlayback.sourceBpm / midiPlayback.bpm;
  midiPlayback.startTime =
    performance.now() - resumeFrom * speedScaleAtStart * 1000;

  // Rebuild the MIDI state at the resume point.
  // This restores program/controller state and re-triggers notes that
  // were already sounding when the user paused, so sustained notes
  // continue instead of disappearing on resume.
  let eventIndex = 0;
  const resumeStateNotes = [];

  while (eventIndex < midiPlayback.timedEvents.length &&
         midiPlayback.timedEvents[eventIndex].sourceSeconds < resumeFrom) {
    const priorEvent = midiPlayback.timedEvents[eventIndex].event;

    try {
      if (priorEvent.type === 'bankSelectMSB') {
        synth.controllerChange(priorEvent.channel, 0, priorEvent.value);
      } else if (priorEvent.type === 'bankSelectLSB') {
        synth.controllerChange(priorEvent.channel, 32, priorEvent.value);
      } else if (priorEvent.type === 'programChange') {
        synth.programChange(priorEvent.channel, priorEvent.program);
      } else if (priorEvent.type === 'controlChange') {
        synth.controllerChange(
          priorEvent.channel,
          priorEvent.controller,
          priorEvent.value
        );
      } else if (priorEvent.type === 'noteOn' && priorEvent.velocity > 0) {
        const priorNote = Math.max(
          0,
          Math.min(
            127,
            priorEvent.note +
              (priorEvent.channel === 9 ? 0 : midiPlayback.transposeSemitones)
          )
        );
        resumeStateNotes.push({
          channel: priorEvent.channel,
          note: priorNote,
          velocity: Math.max(0, Math.min(127, Number(priorEvent.velocity) || 0))
        });
      } else if (
        priorEvent.type === 'noteOff' ||
        (priorEvent.type === 'noteOn' && priorEvent.velocity === 0)
      ) {
        const priorNote = Math.max(
          0,
          Math.min(
            127,
            priorEvent.note +
              (priorEvent.channel === 9 ? 0 : midiPlayback.transposeSemitones)
          )
        );
        for (let i = resumeStateNotes.length - 1; i >= 0; i--) {
          if (resumeStateNotes[i].channel === priorEvent.channel &&
              resumeStateNotes[i].note === priorNote) {
            resumeStateNotes.splice(i, 1);
            break;
          }
        }
      }
    } catch (error) {
      console.error('[midi] Could not rebuild MIDI state:', error);
    }

    eventIndex++;
  }

  for (const active of resumeStateNotes) {
    try {
      synth.noteOn(
        active.channel,
        active.note,
        active.velocity
      );
      midiPlayback.activeNotes.push(active);
    } catch (error) {
      console.error('[midi] Could not resume active note:', error);
    }
  }

  let tempoEventIndex = 0;
  while (tempoEventIndex + 1 < midiPlayback.tempoEventSeconds.length &&
         midiPlayback.tempoEventSeconds[tempoEventIndex + 1].sourceSeconds <= resumeFrom) {
    tempoEventIndex++;
  }

  function scheduleNext() {
    if (!midiPlayback.playing) return;

    const elapsedSeconds =
      (performance.now() - midiPlayback.startTime) / 1000;

    const speedScale =
      midiPlayback.sourceBpm / midiPlayback.bpm;

    const sourceElapsedSeconds =
      elapsedSeconds / speedScale;

    while (
      tempoEventIndex + 1 <
        midiPlayback.tempoEventSeconds.length &&
      midiPlayback.tempoEventSeconds[
        tempoEventIndex + 1
      ].sourceSeconds <= sourceElapsedSeconds
    ) {
      tempoEventIndex++;
    }

    if (midiPlayback.tempoEventSeconds.length) {
      midiPlayback.currentSourceBpm =
        midiPlayback.tempoEventSeconds[
          tempoEventIndex
        ].bpm;
    }

    while (
      eventIndex < midiPlayback.timedEvents.length &&
      midiPlayback.timedEvents[eventIndex].sourceSeconds *
        speedScale <= elapsedSeconds &&
      (!midiPlayback.looping ||
       midiPlayback.loopEndSeconds === null ||
       midiPlayback.timedEvents[eventIndex].sourceSeconds < midiPlayback.loopEndSeconds)
    ) {
      const event =
        midiPlayback.timedEvents[eventIndex++].event;

      try {
        if (event.type === 'bankSelectMSB') {
          synth.controllerChange(
            event.channel, 0, event.value
          );
        } else if (event.type === 'bankSelectLSB') {
          synth.controllerChange(
            event.channel, 32, event.value
          );
        } else if (event.type === 'programChange') {
          synth.programChange(
            event.channel, event.program
          );
        } else if (event.type === 'controlChange') {
          synth.controllerChange(
            event.channel,
            event.controller,
            event.value
          );
        } else if (
          event.type === 'noteOn' &&
          event.velocity > 0
        ) {
          const note = Math.max(
            0,
            Math.min(
              127,
              event.note + (event.channel === 9 ? 0 : midiPlayback.transposeSemitones)
            )
          );

          synth.noteOn(
            event.channel,
            note,
            event.velocity
          );

          midiPlayback.activeNotes.push({
            channel: event.channel,
            note: note
          });
        } else if (event.type === 'noteOff') {
          const note = Math.max(
            0,
            Math.min(
              127,
              event.note + (event.channel === 9 ? 0 : midiPlayback.transposeSemitones)
            )
          );

          synth.noteOff(
            event.channel,
            note
          );
        }
      } catch (error) {
        console.error(
          '[midi] MIDI event failed:',
          error
        );
      }
    }

    const currentSourceTime =
      midiGetCurrentTime();

    if (
      midiPlayback.looping &&
      midiPlayback.loopStartSeconds !== null &&
      midiPlayback.loopEndSeconds !== null &&
      currentSourceTime >= midiPlayback.loopEndSeconds
    ) {
      midiStartPlayback(midiPlayback.loopStartSeconds).catch(function(error) {
        console.error('[midi] Could not restart loop:', error);
        midiPlayback.looping = false;
        setStatus('Loop playback error: ' + (error.message || error));
      });
      return;
    }

    if (eventIndex >= midiPlayback.timedEvents.length) {
      midiStopPlayback();
      return;
    }

    setStatus(
      'Playing: ' +
      midiPlayback.fileName
    );

    midiPlayback.timer =
      setTimeout(scheduleNext, 8);
  }

  sendCommand('midi-started', {
    time: resumeFrom,
    duration: midiPlayback.durationSeconds
  });

  scheduleNext();
}

function midiStopPlayback() {
  midiPlayback.playing = false;

  if (midiPlayback.timer) {
    clearTimeout(midiPlayback.timer);
    midiPlayback.timer = null;
  }

  if (sf2Synth) {
    try {
      sf2Synth.stopAll();
    } catch (e) {}
  }

  midiPlayback.activeNotes = [];
  midiPlayback.pausedTimeSeconds = 0;

  sendCommand('midi-stopped', {
    time: 0
  });

  setStatus('Stopped.');
}

function midiPausePlayback() {
  if (!midiPlayback.playing) return;

  midiPlayback.pausedTimeSeconds = Math.min(
    midiGetCurrentTime(),
    midiPlayback.durationSeconds
  );

  midiPlayback.playing = false;

  if (midiPlayback.timer) {
    clearTimeout(midiPlayback.timer);
    midiPlayback.timer = null;
  }

  if (sf2Synth) {
    try {
      sf2Synth.stopAll();
    } catch (e) {}
  }

  midiPlayback.activeNotes = [];

  sendCommand('midi-paused', {
    time: midiPlayback.pausedTimeSeconds,
    duration: midiPlayback.durationSeconds
  });

  setStatus('Paused.');
}

function midiStartOrPausePlayback() {
  if (midiPlayback.playing) {
    midiPausePlayback();
    return;
  }

  const resumeFrom = midiPlayback.pausedTimeSeconds || 0;
  midiStartPlayback(resumeFrom).catch(function(error) {
    console.error('[midi] Could not start playback:', error);
    setStatus('Playback error: ' + (error.message || error));
  });
}

function midiTogglePlayback() {
  if (midiPlayback.playing) {
    midiStopPlayback();
    return;
  }

  midiStartPlayback().catch(function(error) {
    console.error('[midi] Could not start playback:', error);
    setStatus('Playback error: ' + (error.message || error));
  });
}

function midiGetBarNumberForSeconds(seconds) {
  if (!midiPlayback.parsed || !midiPlayback.parsed.ticksPerQuarter) {
    return 1;
  }

  const tempoEvents = midiPlayback.tempoEventSeconds || [];
  const ticksPerQuarter = midiPlayback.parsed.ticksPerQuarter;

  if (!tempoEvents.length) return 1;

  seconds = Math.max(0, Math.min(seconds, midiPlayback.durationSeconds));

  let segmentIndex = 0;
  while (
    segmentIndex + 1 < tempoEvents.length &&
    tempoEvents[segmentIndex + 1].sourceSeconds <= seconds
  ) {
    segmentIndex++;
  }

  const segment = tempoEvents[segmentIndex];
  const ticksPerSecond =
    (segment.bpm / 60) * ticksPerQuarter;

  const tick = Math.max(
    0,
    segment.tick +
      (seconds - segment.sourceSeconds) * ticksPerSecond
  );

  // The MIDI Karaoke App currently uses a quarter-note beat grid,
  // so one bar is four beats (standard 4/4 time).
  return Math.floor(tick / (ticksPerQuarter * 4)) + 1;
}

function midiMoveLoopStartByBeats(deltaBeats) {
  if (midiPlayback.loopStartSeconds === null) {
    setStatus('Set Loop Start [ first.');
    return;
  }

  if (!midiPlayback.parsed || !midiPlayback.parsed.ticksPerQuarter) {
    return;
  }

  const ticksPerQuarter = midiPlayback.parsed.ticksPerQuarter;
  const currentTick = Math.round(
    midiGetTickForSeconds(midiPlayback.loopStartSeconds) / ticksPerQuarter
  ) * ticksPerQuarter;

  const targetTick = Math.max(0, currentTick + deltaBeats * ticksPerQuarter);

  midiPlayback.loopStartSeconds =
    midiSnapTimeToBeat(midiGetSecondsForTick(targetTick));

  if (
    midiPlayback.loopEndSeconds !== null &&
    midiPlayback.loopEndSeconds <= midiPlayback.loopStartSeconds
  ) {
    midiPlayback.loopEndSeconds = null;
  }

  setStatus('Loop Start: ' + midiGetBarBeatLabelForSeconds(midiPlayback.loopStartSeconds));
}

function midiGetBarBeatLabelForSeconds(seconds) {
  if (!midiPlayback.parsed || !midiPlayback.parsed.ticksPerQuarter) {
    return 'Bar ? | Beat ?';
  }

  const ticksPerQuarter = midiPlayback.parsed.ticksPerQuarter;
  const tick = Math.max(0, Math.round(midiGetTickForSeconds(seconds)));
  const beatIndex = Math.floor(tick / ticksPerQuarter);

  return 'Bar ' + Math.floor(beatIndex / 4 + 1) +
    ' | Beat ' + (beatIndex % 4 + 1);
}

function midiMoveLoopRangeByBars(deltaBars) {
  if (midiPlayback.loopStartSeconds === null || midiPlayback.loopEndSeconds === null) {
    setStatus('Set both Loop Start [ and Loop End ] first.');
    return;
  }

  if (!midiPlayback.parsed || !midiPlayback.parsed.ticksPerQuarter) return;

  const tpq = midiPlayback.parsed.ticksPerQuarter;
  const startTick = Math.round(midiGetTickForSeconds(midiPlayback.loopStartSeconds) / tpq) * tpq;
  const endTick = Math.round(midiGetTickForSeconds(midiPlayback.loopEndSeconds) / tpq) * tpq;
  const rangeTicks = endTick - startTick;
  const durationTick = Math.max(0, Math.round(midiGetTickForSeconds(midiPlayback.durationSeconds) / tpq) * tpq);

  const ticksPerBar = tpq * 4;
  let targetStartTick = Math.max(0, startTick + deltaBars * ticksPerBar);
  let targetEndTick = targetStartTick + rangeTicks;

  if (targetEndTick > durationTick) {
    targetEndTick = durationTick;
    targetStartTick = Math.max(0, targetEndTick - rangeTicks);
  }

  if (targetEndTick <= targetStartTick) return;

  midiPlayback.loopStartSeconds = midiSnapTimeToBeat(midiGetSecondsForTick(targetStartTick));
  midiPlayback.loopEndSeconds = midiSnapTimeToBeat(midiGetSecondsForTick(targetEndTick));

  setStatus(
    'Loop Range: ' +
    midiGetBarBeatLabelForSeconds(midiPlayback.loopStartSeconds) +
    ' -> ' +
    midiGetBarBeatLabelForSeconds(midiPlayback.loopEndSeconds)
  );

  // If Loop Mode is currently playing, apply the moved range immediately.
  // Otherwise the new range will be used the next time Loop Mode starts.
  if (midiPlayback.looping) {
    midiPlayback.pausedTimeSeconds = midiPlayback.loopStartSeconds;

    if (midiPlayback.playing) {
      midiStartPlayback(midiPlayback.loopStartSeconds).catch(function(error) {
        console.error('[midi] Could not restart moved loop range:', error);
        setStatus('Moved loop playback error: ' + (error.message || error));
      });
    }
  }
}

function midiGetTickForSeconds(seconds) {
  const tempoEvents = midiPlayback.tempoEventSeconds || [];
  const ticksPerQuarter = midiPlayback.parsed && midiPlayback.parsed.ticksPerQuarter;

  if (!tempoEvents.length || !ticksPerQuarter) return 0;

  seconds = Math.max(0, Math.min(seconds, midiPlayback.durationSeconds));

  let segmentIndex = 0;
  while (
    segmentIndex + 1 < tempoEvents.length &&
    tempoEvents[segmentIndex + 1].sourceSeconds <= seconds
  ) {
    segmentIndex++;
  }

  const segment = tempoEvents[segmentIndex];
  const ticksPerSecond =
    (segment.bpm / 60) * ticksPerQuarter;

  return segment.tick +
    (seconds - segment.sourceSeconds) * ticksPerSecond;
}

function midiGetSecondsForTick(targetTick) {
  const tempoEvents = midiPlayback.tempoEventSeconds || [];
  const ticksPerQuarter = midiPlayback.parsed && midiPlayback.parsed.ticksPerQuarter;

  if (!tempoEvents.length || !ticksPerQuarter) return 0;

  let segment = tempoEvents[0];
  for (let i = 1; i < tempoEvents.length; i++) {
    if (tempoEvents[i].tick > targetTick) break;
    segment = tempoEvents[i];
  }

  const ticksPerSecond =
    (segment.bpm / 60) * ticksPerQuarter;

  return Math.max(
    0,
    Math.min(
      midiPlayback.durationSeconds,
      segment.sourceSeconds +
        (targetTick - segment.tick) / ticksPerSecond
    )
  );
}

function midiSetLoopStart() {
  const seconds = midiSnapTimeToBeat(midiGetCurrentTime());

  midiPlayback.loopStartSeconds = seconds;

  if (
    midiPlayback.loopEndSeconds !== null &&
    midiPlayback.loopEndSeconds <= seconds
  ) {
    midiPlayback.loopEndSeconds = null;
  }

  setStatus('Loop Start: ' + formatTime(seconds, true));
}

function midiSetLoopEnd() {
  const seconds = midiSnapTimeToBeat(midiGetCurrentTime());

  if (midiPlayback.loopStartSeconds === null) {
    setStatus('Set Loop Start Point [ first.');
    return;
  }

  if (seconds <= midiPlayback.loopStartSeconds) {
    setStatus('Loop End must be after Loop Start.');
    return;
  }

  midiPlayback.loopEndSeconds = seconds;

  setStatus(
    'Loop: ' +
    formatTime(midiPlayback.loopStartSeconds, true) +
    ' - ' +
    formatTime(midiPlayback.loopEndSeconds, true)
  );
}

function midiToggleLoop() {
  if (
    midiPlayback.loopStartSeconds === null ||
    midiPlayback.loopEndSeconds === null ||
    midiPlayback.loopEndSeconds <= midiPlayback.loopStartSeconds
  ) {
    setStatus('Set Loop Start [ and Loop End ] first.');
    return;
  }

  midiPlayback.looping = !midiPlayback.looping;

  if (midiPlayback.looping) {
    midiStartPlayback(midiPlayback.loopStartSeconds).catch(function(error) {
      console.error('[midi] Could not start loop:', error);
      midiPlayback.looping = false;
      setStatus('Loop playback error: ' + (error.message || error));
    });
  } else {
    setStatus('Loop OFF.');
  }
}

/* =========================================================
   MIDI BPM
   ========================================================= */

function midiChangeBpm(delta) {
  const oldBpm = midiPlayback.bpm;
  const newBpm = Math.max(5, oldBpm + delta);

  if (midiPlayback.playing) {
    const now = performance.now();

    const oldSpeedScale =
      midiPlayback.sourceBpm / oldBpm;

    const sourceElapsedSeconds =
      ((now - midiPlayback.startTime) / 1000) /
      oldSpeedScale;

    midiPlayback.bpm = newBpm;

    const newSpeedScale =
      midiPlayback.sourceBpm / midiPlayback.bpm;

    midiPlayback.startTime =
      now -
      sourceElapsedSeconds *
        newSpeedScale *
        1000;
  } else {
    midiPlayback.bpm = newBpm;
  }

  sendCommand('midi-bpm', {
    bpm: midiPlayback.bpm
  });


  setStatus('BPM changed.');
}

function midiRestoreOriginalBpm() {
  if (!midiPlayback.sourceBpmKnown || !midiPlayback.originalBpm) {
    setStatus('No BPM data in the MIDI file.');
    return;
  }

  const targetBpm = midiPlayback.originalBpm;
  const oldBpm = midiPlayback.bpm;

  if (midiPlayback.playing) {
    const now = performance.now();
    const oldSpeedScale = midiPlayback.sourceBpm / oldBpm;
    const sourceElapsedSeconds =
      ((now - midiPlayback.startTime) / 1000) / oldSpeedScale;

    midiPlayback.bpm = targetBpm;

    const newSpeedScale = midiPlayback.sourceBpm / midiPlayback.bpm;
    midiPlayback.startTime =
      now - sourceElapsedSeconds * newSpeedScale * 1000;
  } else {
    midiPlayback.bpm = targetBpm;
  }

  sendCommand('midi-bpm', { bpm: midiPlayback.bpm });
  setStatus('Original MIDI BPM: ' + Math.round(targetBpm));
}

/* =========================================================
   MIDI TRANSPOSE
   ========================================================= */

function midiTranspose(delta) {
  if (sf2Synth && midiPlayback.activeNotes.length) {
    midiPlayback.activeNotes.forEach(function(activeNote) {
      try {
        sf2Synth.noteOff(
          activeNote.channel,
          activeNote.note
        );
      } catch (error) {
        console.error(
          '[midi] Could not release active note:',
          error
        );
      }
    });

    midiPlayback.activeNotes = [];
  }

  midiPlayback.transposeSemitones += delta;


  sendCommand('midi-transpose', {
    semitones: midiPlayback.transposeSemitones,
    delta: delta
  });

  setStatus('');
}

/* =========================================================
   MIDI TIMESTAMPS
   ========================================================= */

function midiRecordTimestamp(kind) {
  const seconds = midiGetCurrentTime();

  const stamp = {
    kind: kind,
    seconds: seconds,
    text: formatTime(seconds, true)
  };

  sendCommand('timestamp', stamp);

  setStatus(
    'Timestamp: ' +
    (kind === 'P+L' ? 'P + L ' : 'L ') +
    stamp.text
  );
}

function midiRemoveTimestamp() {
  sendCommand('timestamp-remove', {
    seconds: midiGetCurrentTime()
  });

  setStatus('Timestamp removed.');
}
